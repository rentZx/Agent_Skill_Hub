server {
    listen 3004;
    listen [::]:3004;
    server_name _;
    server_tokens off;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name 49.233.197.213;
    server_tokens off;

    ssl_certificate /etc/letsencrypt/live/49.233.197.213/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/49.233.197.213/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:AgentSkillHubTLS:10m;
    ssl_session_timeout 1d;

    client_max_body_size 64k;
    limit_req_status 429;

    location ^~ /admin {
        return 404;
    }

    location = /api/github/parse {
        return 404;
    }

    location = /api/github/search {
        return 404;
    }

    location = /api/resources/import {
        return 404;
    }

    location = /api/analyze {
        limit_req zone=agent_skill_hub_analyze burst=4 nodelay;
        proxy_pass http://127.0.0.1:3003;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_send_timeout 15s;
        proxy_read_timeout 60s;
    }

    location / {
        proxy_pass http://127.0.0.1:3003;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_send_timeout 15s;
        proxy_read_timeout 60s;
    }
}
