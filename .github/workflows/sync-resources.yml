name: Sync Agent Skill Hub resources

on:
  schedule:
    - cron: "0 18 * * *"
  workflow_dispatch:

concurrency:
  group: agent-skill-hub-resource-sync
  cancel-in-progress: true

permissions: {}

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Sync resource catalog over SSH
        uses: appleboy/ssh-action@2ead5e36573f08b82fbfce1504f1a4b05a647c6f # v1.2.2
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.DEPLOY_KEY }}
          script: |
            set -e
            cd /opt/apps/agent-skill-hub
            git fetch origin main
            git reset --hard origin/main
            npm ci --no-audit --no-fund
            npm run sync:resources -- --source=all --limit=30 --skills-limit=100 --mcp-limit=200
